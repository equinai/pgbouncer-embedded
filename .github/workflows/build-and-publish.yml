name: Build and Publish

# The npm version of every package names the PgBouncer release it wraps and a
# wrapper rebuild count (scripts/version.sh): PgBouncer X.Y.Z, rebuild R →
# X.Y.(Z*100+R). Every build applies patches/*.patch.
#
#   schedule           newest upstream PgBouncer, rebuild 0; build + publish
#                      unless a wrapper of it is on npm already
#   workflow_dispatch  the given PgBouncer version and rebuild; build + publish
#                      if not on npm yet (a patch-only rebuild: rebuild >= 1)
#   push tag v*        the tag's npm version; build + publish if not on npm yet
#   pull_request,      newest upstream PgBouncer; build + verify, never publish
#   push to main
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'PgBouncer version to build (e.g. 1.26.1)'
        required: true
      rebuild:
        description: 'Wrapper rebuild count for that version, 0-99 (a patch-only rebuild of a published release takes the next one: 1.26.1 rebuild 1 publishes 1.26.101)'
        required: true
        default: '0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      npm_version: ${{ steps.resolve.outputs.npm_version }}
      publish: ${{ steps.resolve.outputs.publish }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version and whether to publish
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          UPSTREAM=https://github.com/pgbouncer/pgbouncer
          NPM_VERSION=""

          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            NPM_VERSION=$(bash scripts/version.sh encode "$VERSION" "$INPUT_REBUILD")
            RELEASE=true
          elif [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            NPM_VERSION="${REF_NAME#v}"
            VERSION=$(bash scripts/version.sh decode "$NPM_VERSION")
            RELEASE=true
          else
            # Highest pgbouncer_X_Y_Z tag upstream (no release candidates).
            VERSION=$(git ls-remote --tags --refs "$UPSTREAM" \
              | sed -nE 's#^.*refs/tags/pgbouncer_([0-9]+)_([0-9]+)_([0-9]+)$#\1.\2.\3#p' \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -n 1)
            if [ "$EVENT" = "schedule" ]; then RELEASE=true; else RELEASE=false; fi
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Resolved version is not X.Y.Z: '${VERSION}'"
            exit 1
          fi

          TAG="pgbouncer_${VERSION//./_}"
          if [ -z "$(git ls-remote --tags --refs "$UPSTREAM" "refs/tags/${TAG}")" ]; then
            echo "::error::PgBouncer has no release tag ${TAG}"
            exit 1
          fi

          if [ -z "$NPM_VERSION" ]; then
            # The newest release upstream: its newest wrapper already on npm
            # (any rebuild — so a later rebuild is never shadowed by a fresh
            # rebuild 0, and a partly published one is completed), else rebuild 0.
            PUBLISHED=$(curl -fsS "https://registry.npmjs.org/@equin/pgbouncer-darwin-arm64" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(Object.keys(JSON.parse(s).versions).join("\n")))')
            NPM_VERSION=""
            for v in $PUBLISHED; do
              [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              if [ "$(bash scripts/version.sh decode "$v")" = "$VERSION" ]; then
                if [ -z "$NPM_VERSION" ] || [ "$(printf '%s\n%s\n' "$NPM_VERSION" "$v" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)" = "$v" ]; then
                  NPM_VERSION="$v"
                fi
              fi
            done
            if [ -z "$NPM_VERSION" ]; then
              NPM_VERSION=$(bash scripts/version.sh encode "$VERSION" 0)
            fi
          fi
          if [ "$(bash scripts/version.sh decode "$NPM_VERSION")" != "$VERSION" ]; then
            echo "::error::npm version ${NPM_VERSION} does not wrap PgBouncer ${VERSION}"
            exit 1
          fi

          # Publish if any of the five packages lacks this version (so a run
          # that published only some of them is completed by the next run).
          MISSING=""
          for pkg in pgbouncer-darwin-arm64 pgbouncer-darwin-x64 pgbouncer-linux-x64 pgbouncer-linux-arm64 pgbouncer-embedded; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@equin/${pkg}/${NPM_VERSION}")
            case "$CODE" in
              200) ;;
              404) MISSING="${MISSING} @equin/${pkg}" ;;
              *) echo "::error::npm registry answered HTTP ${CODE} for @equin/${pkg}@${NPM_VERSION}"; exit 1 ;;
            esac
          done

          PUBLISH=false
          if [ "$RELEASE" = "true" ] && [ -n "$MISSING" ]; then PUBLISH=true; fi
          # A release run with everything already published has nothing to build.
          BUILD=true
          if [ "$RELEASE" = "true" ] && [ "$PUBLISH" = "false" ]; then BUILD=false; fi

          echo "PgBouncer ${VERSION} as npm ${NPM_VERSION} (event: ${EVENT}); not on npm:${MISSING:- none}; build=${BUILD} publish=${PUBLISH}"
          {
            echo "version=${VERSION}"
            echo "npm_version=${NPM_VERSION}"
            echo "publish=${PUBLISH}"
            echo "build=${BUILD}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      PGBOUNCER_VERSION: ${{ needs.resolve.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-latest
            arch: x86_64
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          chmod +x scripts/build.sh
          if [ -n "$ARCH" ]; then
            arch "-$ARCH" bash scripts/build.sh
          else
            bash scripts/build.sh
          fi

      - name: Verify binary
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          BIN="packages/${PLATFORM}/native/bin/pgbouncer"
          test -f "$BIN"
          file "$BIN"
          if [ -n "$ARCH" ]; then
            OUT=$(arch "-$ARCH" "$BIN" --version)
          else
            OUT=$("$BIN" --version)
          fi
          echo "$OUT"
          if ! grep -qF "PgBouncer ${PGBOUNCER_VERSION}" <<<"$OUT"; then
            echo "::error::Expected 'PgBouncer ${PGBOUNCER_VERSION}' in --version output"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: pgbouncer-${{ matrix.platform }}
          path: packages/${{ matrix.platform }}/native/bin/pgbouncer
          retention-days: 7

  publish:
    name: Publish npm packages
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.resolve.outputs.npm_version }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Stage binaries and set versions
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir -p "packages/${platform}/native/bin"
            cp "artifacts/pgbouncer-${platform}/pgbouncer" \
               "packages/${platform}/native/bin/pgbouncer"
            chmod 755 "packages/${platform}/native/bin/pgbouncer"

            node -e "
              const fs = require('fs');
              const p = 'packages/${platform}/package.json';
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              pkg.version = process.env.VERSION;
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            "
          done

          # Update meta package version and optionalDependencies
          node -e "
            const fs = require('fs');
            const p = 'packages/pgbouncer-embedded/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = process.env.VERSION;
            for (const key of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[key] = process.env.VERSION;
            }
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish packages
        run: |
          set -euo pipefail
          # Platform packages first, the meta package (which depends on them) last.
          # Each publish is skipped if that version is already on npm, so a re-run
          # completes a partially published release.
          for dir in darwin-arm64 darwin-x64 linux-x64 linux-arm64 pgbouncer-embedded; do
            name=$(node -p "require('./packages/${dir}/package.json').name")
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name}/${VERSION}")
            case "$CODE" in
              200) echo "==> ${name}@${VERSION} already published, skipping"; continue ;;
              404) ;;
              *) echo "::error::npm registry answered HTTP ${CODE} for ${name}@${VERSION}"; exit 1 ;;
            esac
            echo "==> Publishing ${name}@${VERSION}"
            (cd "packages/${dir}" && npm publish --provenance --access public)
          done

      - name: Tag the release
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if [ -n "$(git ls-remote --tags --refs origin "refs/tags/${TAG}")" ]; then
            echo "Tag ${TAG} already exists"
            exit 0
          fi
          # A GITHUB_TOKEN push does not trigger another workflow run.
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
