name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'npm package version to publish (e.g. 1.25.2)'
        required: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-13
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl

      - name: Build
        run: |
          chmod +x scripts/build.sh
          bash scripts/build.sh

      - name: Verify binary
        run: |
          BIN="packages/${{ matrix.platform }}/native/bin/pgbouncer"
          test -f "$BIN"
          file "$BIN"
          "$BIN" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgbouncer-${{ matrix.platform }}
          path: packages/${{ matrix.platform }}/native/bin/pgbouncer
          retention-days: 7

  publish:
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Stage binaries and set versions
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir -p "packages/${platform}/native/bin"
            cp "artifacts/pgbouncer-${platform}/pgbouncer" \
               "packages/${platform}/native/bin/pgbouncer"
            chmod 755 "packages/${platform}/native/bin/pgbouncer"

            node -e "
              const fs = require('fs');
              const p = 'packages/${platform}/package.json';
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              pkg.version = '${VERSION}';
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            "
          done

      - name: Publish packages
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            echo "==> Publishing @equin/pgbouncer-${platform}"
            cd "packages/${platform}"
            npm publish --provenance --access public
            cd ../..
          done
